<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>STATUFL • Papan Pemuka Unit</title>
  <link rel="stylesheet" href="/theme.css">
</head>

<body>
  <!--
    The supplied dashboard source was not present as a project file, so this
    page contains the requested integration snippets and expects the existing
    dashboard globals ($, esc, db, SUPABASE_URL, playAudioChime) when merged.
  -->
  <div id="notificationsPanel" aria-live="polite" aria-atomic="false"></div>
  <script>
    let notificationRegistration = null;

    async function registerNotificationServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        notificationRegistration = await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        return notificationRegistration;
      } catch (error) {
        notificationRegistration = null;
        return null;
      }
    }

    // =========================================================================
    // ALLSTAT BACKGROUND NOTIFICATION & TOAST RECEIVER
    // =========================================================================
    const LAST_ALLSTAT_KEY = 'statufl_last_allstat_id';

    function escapeToastText(value) {
      if (typeof esc === 'function') return esc(value ?? '');
      const element = document.createElement('span');
      element.textContent = String(value ?? '');
      return element.innerHTML;
    }

    function showAllstatToast(title, body) {
      const panel = document.getElementById('notificationsPanel');
      if (!panel) return;

      const card = document.createElement('div');
      card.className = 'pointer-events-auto rounded-2xl border-2 border-emerald-500 bg-slate-900/95 text-white p-4 shadow-2xl backdrop-blur-md space-y-2 transition-all';
      card.innerHTML = `
        <div class="flex items-start justify-between gap-2 border-b border-white/10 pb-2">
          <div class="font-extrabold text-xs text-emerald-400">${escapeToastText(title)}</div>
          <button type="button" onclick="this.closest('div.pointer-events-auto').remove()"
            class="text-slate-400 hover:text-white text-xs px-1" aria-label="Tutup">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <pre class="whitespace-pre-wrap font-sans text-xs leading-relaxed text-slate-100">${escapeToastText(body)}</pre>
      `;

      panel.prepend(card);
      setTimeout(() => card.remove(), 20000);
    }

    async function handleIncomingAllstat(record) {
      if (!record || !record.id) return;
      const lastSeenId = Number(localStorage.getItem(LAST_ALLSTAT_KEY) || 0);
      if (Number(record.id) <= lastSeenId) return;

      localStorage.setItem(LAST_ALLSTAT_KEY, String(record.id));
      if (typeof playAudioChime === 'function') playAudioChime();
      showAllstatToast(record.title, record.body);

      // Fire native smartphone status-bar notification via Service Worker
      if ('Notification' in window && Notification.permission === 'granted') {
        const reg = notificationRegistration || await registerNotificationServiceWorker();
        const options = {
          body: record.body,
          tag: 'statufl-allstat-' + record.id,
          renotify: true,
          requireInteraction: true,
          vibrate: [200, 100, 200]
        };
        if (reg?.showNotification) {
          await reg.showNotification(record.title, options);
        } else {
          new Notification(record.title, options);
        }
      }
    }

    async function checkLatestAllstat(isInitialLoad = false) {
      if (typeof SUPABASE_URL === 'undefined' || !SUPABASE_URL || SUPABASE_URL.includes('PASTE_YOUR') || typeof db === 'undefined' || !db) return;
      const {
        data: rows,
        error
      } = await db
        .from('allstat_broadcasts')
        .select('*')
        .order('id', {
          ascending: false
        })
        .limit(1);

      if (error || !rows?.length) return;
      const latest = rows[0];

      if (isInitialLoad && !localStorage.getItem(LAST_ALLSTAT_KEY)) {
        localStorage.setItem(LAST_ALLSTAT_KEY, String(latest.id));
        return;
      }
      await handleIncomingAllstat(latest);
    }

    addEventListener('DOMContentLoaded', () => {
      if (typeof SUPABASE_URL !== 'undefined' && SUPABASE_URL && !SUPABASE_URL.includes('PASTE_YOUR') && typeof db !== 'undefined' && db) {
        checkLatestAllstat(true);

        db.channel('statufl-allstat')
          .on(
            'postgres_changes', {
              event: 'INSERT',
              schema: 'public',
              table: 'allstat_broadcasts'
            },
            payload => handleIncomingAllstat(payload.new)
          )
          .subscribe();

        // Catch missed broadcasts if smartphone browser slept and woke up
        setInterval(() => checkLatestAllstat(false), 10000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) checkLatestAllstat(false);
        });
      }
    });

  </script>
</body>

</html>
